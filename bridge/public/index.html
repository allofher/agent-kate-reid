<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kate Reid — Strudel bridge</title>
<style>
  body { margin: 0; font: 14px/1.5 monospace; background: #111; color: #ddd; }
  #status { padding: 8px 14px; background: #1b1b1b; border-bottom: 1px solid #333;
            display: flex; gap: 18px; }
  .ok  { color: #7c6; }
  .bad { color: #e66; }
  #code { padding: 14px; white-space: pre-wrap; }
  #overlay { position: fixed; inset: 0; background: #111e; display: flex;
             align-items: center; justify-content: center; font-size: 22px;
             cursor: pointer; }
</style>
</head>
<body>
<div id="status">
  <span id="ws-status" class="bad">ws: connecting…</span>
  <span id="play-status">stopped</span>
  <span id="err-status"></span>
</div>
<pre id="code">// Kate's code shows up here</pre>
<div id="overlay">click anywhere to activate audio</div>

<!-- Vendored @strudel/web bundle, served by server.mjs from node_modules.
     No CDN: this page works fully offline. -->
<script src="/vendor/index.js"></script>
<script>
'use strict';

// --- REPL state, mirrored to the harness as the `state` payload -------------

let lastCode = '';
let playing = false;
let lastError = null;

// initStrudel registers the pattern vocabulary and resumes audio on the first
// click (browser autoplay policy — cannot be bypassed). No prebake: samples
// stay local-only; built-in synths work with zero network.
initStrudel();

document.getElementById('overlay').addEventListener('click', (e) => {
  e.currentTarget.remove();
}, { once: true });

// --- control handlers --------------------------------------------------------

const actions = {
  async evaluate({ code }) {
    lastCode = code ?? '';
    await strudel.evaluate(lastCode);
    playing = lastCode.trim() !== '';
  },
  async play() {
    await strudel.evaluate(lastCode);
    playing = lastCode.trim() !== '';
  },
  stop() {
    strudel.hush();
    playing = false;
  },
  async toggle() {
    if (playing) actions.stop();
    else await actions.play();
  },
  getState() {},
};

function stateMsg(requestId) {
  return {
    type: 'state',
    payload: { code: lastCode, playing, error: lastError, timestamp: Date.now() },
    ...(requestId !== undefined && { requestId }),
  };
}

// --- WebSocket client (same origin as this page) ------------------------------

let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    setStatus('ws-status', 'ws: connected', true);
    ws.send(JSON.stringify({ type: 'handshake', clientType: 'browser' }));
    ws.send(JSON.stringify(stateMsg())); // initial state push
  };

  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type !== 'control') return;

    const handler = actions[msg.action];
    if (!handler) {
      ws.send(JSON.stringify({
        type: 'error',
        error: `unknown action: ${msg.action}`,
        requestId: msg.requestId,
      }));
      return;
    }

    lastError = null;
    try {
      await handler(msg.payload ?? {});
    } catch (err) {
      lastError = String(err?.message ?? err);
      playing = false;
    }
    ws.send(JSON.stringify(stateMsg(msg.requestId)));
    render();
  };

  ws.onclose = () => {
    setStatus('ws-status', 'ws: reconnecting…', false);
    setTimeout(connect, 2000);
  };
}

connect();

// --- display ------------------------------------------------------------------

function setStatus(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = ok ? 'ok' : 'bad';
}

function render() {
  setStatus('play-status', playing ? 'playing' : 'stopped', playing);
  setStatus('err-status', lastError ?? '', !lastError);
  document.getElementById('code').textContent = lastCode || '// Kate\'s code shows up here';
}

// --- future: mic input ----------------------------------------------------------
// This page is the natural home for live-audio capture: getUserMedia →
// AnalyserNode → features (onset, pitch, RMS, tempo) → sent over the same
// WebSocket for the harness to fold into the quantized queue.
</script>
</body>
</html>
